<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Pulse — Security Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0d1117;
    --surface2: #131920;
    --border: #1e2d3d;
    --text: #c9d1d9;
    --text-dim: #4a5568;
    --text-muted: #2d3748;
    --accent: #00d4ff;

    --daily-color: #00d4ff;
    --daily-dim: rgba(0, 212, 255, 0.08);
    --daily-glow: rgba(0, 212, 255, 0.25);
    --daily-border: rgba(0, 212, 255, 0.3);

    --weekly-color: #ff6b35;
    --weekly-dim: rgba(255, 107, 53, 0.08);
    --weekly-glow: rgba(255, 107, 53, 0.25);
    --weekly-border: rgba(255, 107, 53, 0.3);

    --timeline-h: 80px;
    --dot-size: 8px;
    --dot-active: 14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
  }

  /* ── SCAN LINE OVERLAY ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* ── LAYOUT ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── HEADER ── */
  header {
    padding: 18px 32px 0;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-shrink: 0;
  }

  .site-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    text-shadow: 0 0 20px var(--daily-glow);
  }

  .site-sub {
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* ── TIMELINE ── */
  #timeline-wrap {
    position: relative;
    height: var(--timeline-h);
    flex-shrink: 0;
    margin-top: 10px;
    overflow: hidden;
  }

  /* fade edges */
  #timeline-wrap::before,
  #timeline-wrap::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 120px;
    z-index: 2;
    pointer-events: none;
  }
  #timeline-wrap::before {
    left: 0;
    background: linear-gradient(to right, var(--bg), transparent);
  }
  #timeline-wrap::after {
    right: 0;
    background: linear-gradient(to left, var(--bg), transparent);
  }

  #timeline-track {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 1px;
    background: var(--border);
    transition: left 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    display: flex;
    align-items: center;
  }

  .tl-dot-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    flex-shrink: 0;
  }

  .tl-dot {
    width: var(--dot-size);
    height: var(--dot-size);
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.35s ease;
    flex-shrink: 0;
    position: relative;
  }

  .tl-dot.daily { background: var(--daily-color); opacity: 0.4; }
  .tl-dot.weekly { background: var(--weekly-color); opacity: 0.4; }

  .tl-dot.active {
    width: var(--dot-active);
    height: var(--dot-active);
    opacity: 1 !important;
  }
  .tl-dot.active.daily {
    box-shadow: 0 0 0 3px rgba(0,212,255,0.15), 0 0 16px var(--daily-glow);
  }
  .tl-dot.active.weekly {
    box-shadow: 0 0 0 3px rgba(255,107,53,0.15), 0 0 16px var(--weekly-glow);
  }

  .tl-date {
    position: absolute;
    top: calc(50% + 16px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.6rem;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .tl-dot-wrap.active .tl-date {
    opacity: 1;
    color: var(--text);
  }

  /* center marker */
  #timeline-wrap .center-line {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(255,255,255,0.06);
    transform: translateX(-50%);
    z-index: 1;
    pointer-events: none;
  }

  /* ── ACTION BUBBLES ── */
  #action-bar {
    display: flex;
    gap: 10px;
    padding: 0 32px 14px;
    flex-shrink: 0;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .add-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    background: transparent;
    transition: all 0.2s ease;
    text-transform: uppercase;
  }

  .add-btn.daily-btn {
    border-color: var(--daily-border);
    color: var(--daily-color);
  }
  .add-btn.daily-btn:hover {
    background: var(--daily-dim);
    box-shadow: 0 0 12px var(--daily-glow);
  }

  .add-btn.weekly-btn {
    border-color: var(--weekly-border);
    color: var(--weekly-color);
  }
  .add-btn.weekly-btn:hover {
    background: var(--weekly-dim);
    box-shadow: 0 0 12px var(--weekly-glow);
  }

  .add-btn svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    flex-shrink: 0;
  }

  .post-count {
    margin-left: auto;
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* ── COMPOSE PANEL ── */
  #compose-panel {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    animation: slideDown 0.2s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #compose-panel.open { display: flex; }
  #compose-panel.daily { border-left: 3px solid var(--daily-color); background: var(--daily-dim); }
  #compose-panel.weekly { border-left: 3px solid var(--weekly-color); background: var(--weekly-dim); }

  .compose-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .compose-type-badge {
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 999px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
  }

  .daily .compose-type-badge { background: var(--daily-dim); color: var(--daily-color); border: 1px solid var(--daily-border); }
  .weekly .compose-type-badge { background: var(--weekly-dim); color: var(--weekly-color); border: 1px solid var(--weekly-border); }

  .compose-date-input {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .compose-date-input:focus { outline: none; border-color: var(--text-dim); }

  .compose-title-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 6px 0;
    letter-spacing: 0.03em;
  }
  .compose-title-input:focus { outline: none; }
  .compose-title-input::placeholder { color: var(--text-muted); }

  .compose-body {
    width: 100%;
    min-height: 90px;
    max-height: 180px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    line-height: 1.7;
    resize: vertical;
    padding: 4px 0;
  }
  .compose-body:focus { outline: none; }
  .compose-body::placeholder { color: var(--text-muted); }

  .compose-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: border-color 0.2s;
  }
  .btn-cancel:hover { border-color: var(--text-dim); }

  .btn-post {
    border: none;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    padding: 6px 18px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    transition: all 0.2s;
  }

  .daily .btn-post { background: var(--daily-color); color: #000; }
  .daily .btn-post:hover { box-shadow: 0 0 14px var(--daily-glow); }
  .weekly .btn-post { background: var(--weekly-color); color: #000; }
  .weekly .btn-post:hover { box-shadow: 0 0 14px var(--weekly-glow); }

  /* ── POSTS FEED ── */
  #feed {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px 40px;
    scroll-behavior: smooth;
  }

  #feed::-webkit-scrollbar { width: 4px; }
  #feed::-webkit-scrollbar-track { background: transparent; }
  #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* date group separator */
  .date-group {
    margin-bottom: 32px;
  }

  .date-label {
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .date-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* post card */
  .post-card {
    position: relative;
    padding: 16px 20px;
    border-radius: 6px;
    margin-bottom: 12px;
    border: 1px solid transparent;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-card.daily {
    background: var(--daily-dim);
    border-color: var(--daily-border);
  }
  .post-card.daily:hover {
    box-shadow: 0 0 20px rgba(0,212,255,0.08);
    border-color: rgba(0,212,255,0.5);
  }

  .post-card.weekly {
    background: var(--weekly-dim);
    border-color: var(--weekly-border);
  }
  .post-card.weekly:hover {
    box-shadow: 0 0 20px rgba(255,107,53,0.08);
    border-color: rgba(255,107,53,0.5);
  }

  .post-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .post-type-tag {
    font-size: 0.55rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
  }

  .daily .post-type-tag { background: rgba(0,212,255,0.12); color: var(--daily-color); }
  .weekly .post-type-tag { background: rgba(255,107,53,0.12); color: var(--weekly-color); }

  .post-time {
    font-size: 0.6rem;
    color: var(--text-dim);
  }

  .post-delete {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 3px;
    transition: color 0.2s, background 0.2s;
    font-family: 'Space Mono', monospace;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .post-card:hover .post-delete { opacity: 1; }
  .post-delete:hover { color: #ff4d4d; background: rgba(255,77,77,0.08); }

  .post-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: #e6edf3;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
    line-height: 1.4;
  }

  .post-body {
    font-size: 0.75rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* left accent bar */
  .post-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 12px;
    bottom: 12px;
    width: 2px;
    border-radius: 1px;
  }
  .post-card.daily::before { background: var(--daily-color); }
  .post-card.weekly::before { background: var(--weekly-color); }

  /* ── EMPTY STATE ── */
  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  .empty-icon {
    width: 40px;
    height: 40px;
    opacity: 0.2;
  }

  #empty-state p {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    line-height: 1.8;
  }

  /* ── LOADING ── */
  #loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 6px;
  }

  .ld { width: 5px; height: 5px; border-radius: 50%; background: var(--text-dim); animation: ld 1s ease infinite; }
  .ld:nth-child(2) { animation-delay: 0.15s; }
  .ld:nth-child(3) { animation-delay: 0.3s; }
  @keyframes ld { 0%,80%,100% { transform: scale(0.6); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.7rem;
    padding: 10px 18px;
    border-radius: 6px;
    z-index: 999;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.2s ease;
    pointer-events: none;
    letter-spacing: 0.05em;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.err { border-color: rgba(255,77,77,0.4); color: #ff6b6b; }
</style>
</head>
<body>
<div id="app">

  <header>
    <span class="site-title">Cyber Pulse</span>
    <span class="site-sub">// security intel journal</span>
  </header>

  <!-- TIMELINE -->
  <div id="timeline-wrap">
    <div class="center-line"></div>
    <div id="timeline-track"></div>
  </div>

  <!-- ACTION BAR -->
  <div id="action-bar">
    <button class="add-btn daily-btn" onclick="openCompose('daily')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Daily Entry
    </button>
    <button class="add-btn weekly-btn" onclick="openCompose('weekly')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Weekly Summary
    </button>
    <span class="post-count" id="post-count"></span>
  </div>

  <!-- COMPOSE PANEL -->
  <div id="compose-panel">
    <div class="compose-header">
      <span class="compose-type-badge" id="compose-badge">DAILY</span>
      <input type="date" class="compose-date-input" id="compose-date">
    </div>
    <input class="compose-title-input" id="compose-title" placeholder="Entry title (optional)">
    <textarea class="compose-body" id="compose-body" placeholder="What happened in the cyber world today..."></textarea>
    <div class="compose-actions">
      <button class="btn-cancel" onclick="closeCompose()">Cancel</button>
      <button class="btn-post" onclick="submitPost()">Publish</button>
    </div>
  </div>

  <!-- FEED -->
  <div id="feed">
    <div id="loading">
      <div class="ld"></div><div class="ld"></div><div class="ld"></div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
const API = 'api.php';
let posts = [];
let currentType = 'daily';
let activeDotIndex = 0;

// ── UTILS ──────────────────────────────────────────────────────────────
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (err ? ' err' : '');
  setTimeout(() => { el.className = ''; }, 2800);
}

function fmtDate(d) {
  const [y, m, day] = d.split('-');
  return new Date(y, m - 1, day).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtTime(dt) {
  if (!dt) return '';
  const d = new Date(dt);
  return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function todayStr() {
  const d = new Date();
  return d.toISOString().split('T')[0];
}

// ── API ────────────────────────────────────────────────────────────────
async function loadPosts() {
  try {
    const res = await fetch(API);
    posts = await res.json();
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<span style="color:var(--text-dim);font-size:.7rem">Could not connect to server.</span>';
  }
}

async function submitPost() {
  const title = document.getElementById('compose-title').value.trim();
  const content = document.getElementById('compose-body').value.trim();
  const date = document.getElementById('compose-date').value || todayStr();

  if (!content) { toast('Write something first.', true); return; }

  const btn = document.querySelector('.btn-post');
  btn.textContent = '...';
  btn.disabled = true;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: currentType, title, content, date })
    });
    const post = await res.json();
    posts.unshift(post);
    posts.sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at));
    closeCompose();
    render();
    toast('Entry published.');
  } catch(e) {
    toast('Failed to save. Check server.', true);
  } finally {
    btn.textContent = 'Publish';
    btn.disabled = false;
  }
}

async function deletePost(id) {
  try {
    await fetch(API + '?id=' + encodeURIComponent(id), { method: 'DELETE' });
    posts = posts.filter(p => p.id !== id);
    render();
    toast('Entry deleted.');
  } catch(e) {
    toast('Delete failed.', true);
  }
}

// ── COMPOSE ────────────────────────────────────────────────────────────
function openCompose(type) {
  currentType = type;
  const panel = document.getElementById('compose-panel');
  panel.className = 'open ' + type;
  document.getElementById('compose-badge').textContent = type === 'daily' ? 'DAILY ENTRY' : 'WEEKLY SUMMARY';
  document.getElementById('compose-date').value = todayStr();
  document.getElementById('compose-title').value = '';
  document.getElementById('compose-body').value = '';
  document.getElementById('compose-body').focus();
}

function closeCompose() {
  document.getElementById('compose-panel').className = '';
}

// ── RENDER ────────────────────────────────────────────────────────────
function groupByDate(posts) {
  const groups = {};
  posts.forEach(p => {
    if (!groups[p.date]) groups[p.date] = [];
    groups[p.date].push(p);
  });
  return groups;
}

function render() {
  const feed = document.getElementById('feed');
  const count = document.getElementById('post-count');

  if (posts.length === 0) {
    feed.innerHTML = `
      <div id="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <p>No entries yet.<br>Start documenting the cyber landscape.</p>
      </div>`;
    count.textContent = '';
    buildTimeline([]);
    return;
  }

  count.textContent = posts.length + (posts.length === 1 ? ' entry' : ' entries');
  const groups = groupByDate(posts);
  const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

  feed.innerHTML = sortedDates.map((date, di) => `
    <div class="date-group" data-date="${date}">
      <div class="date-label">${fmtDate(date)}</div>
      ${groups[date].map((p, pi) => `
        <div class="post-card ${p.type}" style="animation-delay:${(di * 2 + pi) * 0.05}s">
          <div class="post-meta">
            <span class="post-type-tag">${p.type === 'daily' ? 'Daily' : 'Weekly'}</span>
            <span class="post-time">${fmtTime(p.created_at)}</span>
            <button class="post-delete" onclick="deletePost('${p.id}')">✕</button>
          </div>
          ${p.title ? `<div class="post-title">${escHtml(p.title)}</div>` : ''}
          <div class="post-body">${escHtml(p.content)}</div>
        </div>
      `).join('')}
    </div>
  `).join('');

  buildTimeline(sortedDates);
  setupScrollSync(sortedDates);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── TIMELINE ──────────────────────────────────────────────────────────
function buildTimeline(dates) {
  const track = document.getElementById('timeline-track');
  const wrap = document.getElementById('timeline-wrap');
  const centerX = wrap.offsetWidth / 2;
  const itemW = 80;

  if (dates.length === 0) {
    track.innerHTML = '';
    track.style.width = '100%';
    track.style.left = '0';
    return;
  }

  const totalW = dates.length * itemW;
  track.style.width = totalW + 'px';

  // get type of first post in each date
  const groups = groupByDate(posts);
  track.innerHTML = dates.map((d, i) => {
    const type = groups[d][0].type;
    const isActive = i === 0;
    return `
      <div class="tl-dot-wrap ${isActive ? 'active' : ''}" data-index="${i}">
        <div class="tl-dot ${type} ${isActive ? 'active' : ''}"></div>
        <div class="tl-date">${fmtDate(d)}</div>
      </div>`;
  }).join('');

  // initial position: center first dot
  track.style.left = (centerX - itemW / 2) + 'px';
}

function setActiveDot(index) {
  if (index === activeDotIndex) return;
  activeDotIndex = index;

  const wrap = document.getElementById('timeline-wrap');
  const track = document.getElementById('timeline-track');
  const centerX = wrap.offsetWidth / 2;
  const itemW = 80;

  // move track
  const targetLeft = centerX - (index * itemW) - itemW / 2;
  track.style.left = targetLeft + 'px';

  // update dots
  const wraps = track.querySelectorAll('.tl-dot-wrap');
  const dots = track.querySelectorAll('.tl-dot');
  wraps.forEach((w, i) => { w.classList.toggle('active', i === index); });
  dots.forEach((d, i) => { d.classList.toggle('active', i === index); });
}

// ── SCROLL SYNC ───────────────────────────────────────────────────────
function setupScrollSync(dates) {
  const feed = document.getElementById('feed');
  let ticking = false;

  feed.onscroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      const groups = feed.querySelectorAll('.date-group');
      let closest = 0;
      let minDist = Infinity;

      groups.forEach((g, i) => {
        const rect = g.getBoundingClientRect();
        const feedRect = feed.getBoundingClientRect();
        const dist = Math.abs(rect.top - feedRect.top);
        if (dist < minDist) { minDist = dist; closest = i; }
      });

      setActiveDot(closest);
      ticking = false;
    });
  };
}

// ── BOOT ─────────────────────────────────────────────────────────────
loadPosts();
</script>
